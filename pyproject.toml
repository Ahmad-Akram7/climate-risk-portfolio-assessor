[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-risk-portfolio-assessor"
version = "1.0.0"
description = "Climate Risk Portfolio Assessor - Multi-hazard risk assessment for infrastructure"
requires-python = ">=3.11"

dependencies = [
"fastapi>=0.110",
"uvicorn>=0.27",
"pandas>=2.1",
"numpy>=1.26",
"pydantic>=2.5",
"requests>=2.31",
"python-multipart>=0.0.9",
"streamlit>=1.40",
"plotly>=5.20",
"pydeck>=0.9",
"geopandas>=0.14",
"shapely>=2.0",
"pyogrio>=0.7",
"rasterio>=1.3",
]

[dependency-groups]
dev = [
"pytest>=8",
"httpx>=0.27",
]
